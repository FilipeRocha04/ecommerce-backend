[project]
name = "autopecas-backend"
version = "0.1.0"
description = "Backend do e-commerce inteligente de autopeças"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "sqlalchemy>=2.0.35,<2.1.0",
    "alembic>=1.13.3,<1.14.0",
    "psycopg[binary]>=3.2.3,<3.3.0",
    "pydantic>=2.9.2,<3.0.0",
    "pydantic-settings>=2.5.2,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "httpx>=0.27.2,<0.28.0",
    "ruff>=0.7.0,<0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
